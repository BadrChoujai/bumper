# Copy this to bumper.policy.yaml in your project (or ~/.bumper/policy.yaml
# for every project) to add your own rules. If no policy file exists, Bumper
# uses its built-in default rules automatically. Rules you add here are
# checked first (so one can override a built-in rule by matching before it,
# or by reusing its id) but the 50+ built-in danger-pack rules stay active
# underneath either way -- this file only ever adds to that, never replaces it.

default: allow         # allow | deny | ask  — what happens when nothing below matches
timeout_seconds: 90    # how long to wait for you before falling back
timeout_decision: deny # what happens if you don't respond in time

rules:
  - id: destructive-delete-broad
    match:
      command: "rm -rf *"
    decision: deny
    explain: "This would permanently delete files with no way to undo it."

  - id: force-push
    match:
      command: "git push --force*"
    decision: ask
    explain: "This will overwrite the project's shared history. If you've shared this project with anyone else, their work could be lost."

  - id: stripe-live-key
    match:
      content_pattern: "sk_live_[A-Za-z0-9]{10,}"
    decision: ask
    explain: "This looks like a real (live) Stripe secret key being written into {file}. If it ever ends up somewhere public, someone could use it to charge your account."

  # You don't have to write a full sentence for every rule. Reuse one of
  # Bumper's built-in categories and it supplies the wording for you:
  #   recursive-delete, force-push, unpublish, env-write, secret-write
  # (secret-write also wants a short `secret_name` and `consequence`, instead
  # of a full sentence -- see src/policy.js for examples).
  - id: block-my-deploy-script
    match:
      command: "*rm -rf*dist*"
    decision: ask
    category: recursive-delete

  # Add your own rules the same way — match on `command` (glob), `file` (glob),
  # or `content_pattern` (regex, checked against code being written), then set
  # `decision` to allow / deny / ask, and either write `explain` in plain
  # English or reuse a `category` as above. {command}, {file}, and {tool} get
  # filled in automatically. Rules with neither still get a safe, honest
  # fallback message ("This matches your rule '...' and is set to ask.") --
  # not a guess at what the command does, but never silent either.
