<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bumper</title>
<style>
  :root {
    --bg: #f6f7f5;
    --card: #ffffff;
    --ink: #1c1f1a;
    --muted: #6b6f66;
    --allow: #2f8f5b;
    --allow-hover: #257249;
    --deny: #c85c4a;
    --deny-hover: #a94a3b;
    --border: #e7e8e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header .mark { font-size: 34px; }
  header h1 { font-size: 22px; margin: 8px 0 2px; }
  header p { color: var(--muted); margin: 0; font-size: 14px; }

  .empty {
    text-align: center;
    padding: 56px 24px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .empty .big { font-size: 32px; margin-bottom: 8px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card .tag {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    margin-bottom: 12px;
  }
  .card p.msg { font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
  .buttons { display: flex; gap: 10px; }
  button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.allow { background: var(--allow); color: white; }
  button.allow:hover { background: var(--allow-hover); }
  button.deny { background: var(--deny); color: white; }
  button.deny:hover { background: var(--deny-hover); }

  details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .tech {
    margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">🟢</div>
      <h1>Bumper</h1>
      <p>watching what your AI assistant is about to do</p>
    </header>
    <div id="list"></div>
  </div>

<script>
async function fetchPending() {
  try {
    const res = await fetch("/pending");
    return await res.json();
  } catch {
    return [];
  }
}

async function decide(id, decision) {
  await fetch("/decide", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id, decision }),
  });
  render();
}

function cardHtml(item) {
  const req = item.request || {};
  const tech = [
    req.agent ? "agent: " + req.agent : null,
    req.tool ? "tool: " + req.tool : null,
    req.command ? "command: " + req.command : null,
    req.file ? "file: " + req.file : null,
  ].filter(Boolean).join("\n");

  return `
    <div class="card">
      <span class="tag">${req.agent || "your assistant"}</span>
      <p class="msg">${item.plainText}</p>
      <div class="buttons">
        <button class="allow" onclick="decide('${item.id}','allow')">Allow</button>
        <button class="deny" onclick="decide('${item.id}','deny')">Don't allow</button>
      </div>
      ${tech ? `<details><summary>show technical details</summary><div class="tech">${tech}</div></details>` : ""}
    </div>
  `;
}

async function render() {
  const items = await fetchPending();
  const list = document.getElementById("list");
  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><div class="big">✅</div>All clear — nothing waiting on you right now.</div>`;
    return;
  }
  list.innerHTML = items.map(cardHtml).join("");
}

render();
setInterval(render, 1500);
</script>
</body>
</html>
